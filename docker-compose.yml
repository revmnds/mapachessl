x-db-env: &db-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-mapachessl}
  DB_USERNAME: ${DB_USERNAME:-mapachessl}
  DB_PASSWORD: ${DB_PASSWORD:-secret}

services:
  postgres:
    image: postgres:17-alpine
    container_name: mapachessl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mapachessl}
      POSTGRES_USER: ${DB_USERNAME:-mapachessl}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mapachessl

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mapachessl-app
    restart: unless-stopped
    environment:
      <<: *db-env
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - public_build:/var/www/html/public/build
      - ./storage/app/certificates:/var/www/html/storage/app/certificates
    networks:
      - mapachessl

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Each generation can hold a worker for up to an hour while the user sets up DNS/HTTP
    command: php artisan queue:work --sleep=3 --tries=1 --timeout=3900
    deploy:
      replicas: ${QUEUE_WORKERS:-4}
    environment:
      <<: *db-env
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - public_build:/var/www/html/public/build
      - ./storage/app/certificates:/var/www/html/storage/app/certificates
    networks:
      - mapachessl
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: mapachessl-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - public_build:/var/www/html/public/build
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mapachessl

networks:
  mapachessl:
    driver: bridge

volumes:
  public_build:
  postgres_data:
