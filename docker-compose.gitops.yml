# ===========================================================================
# Production stack for Portainer (Stacks > Add stack > Repository).
#
#   Repository URL:  https://github.com/revmnds/mapachessl  (public, no auth)
#   Reference:       refs/heads/main
#   Compose path:    docker-compose.gitops.yml
#   GitOps updates:  on, polling every 5m: each push to main redeploys
#
# Secrets are NOT stored here; set them as stack environment variables:
#   APP_KEY      required  (php artisan key:generate --show)
#   DB_PASSWORD  required
#   Optional: APP_URL, QUEUE_WORKERS, ACME_MAX_QUEUE, LOG_LEVEL,
#             TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (operator alerts)
#
# Nothing is published on the host. Nginx Proxy Manager reaches the `web`
# service through the external `npm` network as mapachessl-nginx:80; TLS is
# terminated by Cloudflare and NPM.
# ===========================================================================

x-app-env: &app-env
  APP_NAME: MapacheSSL
  APP_ENV: production
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-https://mapachessl.com}
  APP_LOCALE: ${APP_LOCALE:-es}
  APP_FALLBACK_LOCALE: en

  # Logs go to stdout/stderr so they show up in Portainer
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}

  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-mapachessl}
  DB_USERNAME: ${DB_USERNAME:-mapachessl}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  CACHE_STORE: database
  QUEUE_CONNECTION: database

  ACME_STAGING: "false"
  QUEUE_WORKERS: ${QUEUE_WORKERS:-20}
  ACME_MAX_QUEUE: ${ACME_MAX_QUEUE:-50}

  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  image: mapachessl/app:latest
  # The image lives in no registry: `build` makes Portainer rebuild on every
  # redeploy instead of failing the pull, so a push actually reaches the containers
  pull_policy: build
  restart: unless-stopped

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: mapachessl/web:latest
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - app
    networks:
      internal:
      npm:
        # Name NPM forwards to. An alias instead of container_name so redeploys
        # don't fail with "container name already in use".
        aliases:
          - mapachessl-nginx

  app:
    <<: *app-build
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  queue:
    <<: *app-build
    # Each generation can hold a worker for up to an hour while the user sets up DNS/HTTP
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=1", "--timeout=3900"]
    deploy:
      # ~30 MB each, idle most of the time while users set up DNS
      replicas: ${QUEUE_WORKERS:-20}
    environment:
      <<: *app-env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - internal

  scheduler:
    <<: *app-build
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mapachessl}
      POSTGRES_USER: ${DB_USERNAME:-mapachessl}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

volumes:
  # Holds the Let's Encrypt account key (storage/app/acme)
  storage:
  pg_data:

networks:
  internal:
  npm:
    external: true
