; Loaded after the image's www.conf, overriding its 5-process default.
; Requests are short (wizard API + polling every 2s per waiting user), so more
; children absorb traffic spikes; each uses ~30-40 MB.
[www]
pm = dynamic
pm.max_children = 30
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500
